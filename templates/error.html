{% extends "base.html" %}
{% block title %}{{ error_title|tr }} · DataPilot{% endblock %}

{% block content %}
<section class="error-page" aria-labelledby="error-title">
  <span class="error-code">{{ status_code }}</span>
  <span class="eyebrow" style="display:block">{{ _('DataPilot reste disponible') }}</span>
  <h1 id="error-title">{{ error_title|tr }}</h1>
  <p>{{ error_message|tr }}</p>
  <div class="error-actions">
    <a class="btn primary" href="{{ url_for('index') }}">{{ _('Revenir à l’accueil') }}</a>
    <button class="btn secondary" type="button" onclick="window.location.reload()">{{ _('Réessayer') }}</button>
  </div>
</section>
{% endblock %}
